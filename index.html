<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Toán Rời Rạc Platform — Nền tảng Học tập & Thực nghiệm Trực quan</title>
  <!-- KaTeX for Academic Mathematical Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="stylesheet" href="./src/ui/styles/main.css">
</head>
<body>

  <!-- Global Application Header -->
  <header class="app-header">
    <div class="header-left" style="display:flex;align-items:center;gap:12px;">
      <!-- Mobile Menu Hamburger Toggle Button (Góc trái trên mobile) -->
      <button type="button" class="btn-mobile-menu-toggle" id="btnMobileMenuToggle" aria-label="Mở menu điều hướng" aria-expanded="false" title="Menu điều hướng">
        <svg class="hamburger-icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="hamburger-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <a href="#home" class="brand-wrap" id="brandLogo">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">Toán Rời Rạc Platform</span>
        <span class="brand-badge">Đại học</span>
      </a>

      <!-- Primary Navigation -->
      <nav class="nav-links" aria-label="Điều hướng chính">
        <button class="nav-btn active" data-view="home">
          <span>🏠</span>
          <span class="nav-text">Trang chủ</span>
        </button>
        <button class="nav-btn" data-view="theory">
          <span>📚</span>
          <span class="nav-text">Lý thuyết</span>
        </button>

        <!-- Consolidated Lab Dropdown -->
        <div class="nav-dropdown" id="labDropdown">
          <button type="button" class="nav-btn nav-dropdown-toggle" id="btnLabDropdown" aria-haspopup="true" aria-expanded="false" title="Chọn phòng thực nghiệm">
            <span>🧪</span>
            <span class="nav-text" id="labDropdownText">Phòng Lab</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          
          <div class="nav-dropdown-menu" id="labDropdownMenu" role="menu">
            <button type="button" class="dropdown-item" data-view="logic" role="menuitem">
              <span class="item-icon" style="color:#f59e0b;border-color:rgba(245,158,11,0.35);">⚡</span>
              <div class="item-content">
                <span class="item-title">Logic Lab</span>
                <span class="item-desc">Chương 1 &amp; 2: Bảng chân trị, K-Map, Mạch số</span>
              </div>
            </button>
            <button type="button" class="dropdown-item" data-view="counting" role="menuitem">
              <span class="item-icon" style="color:#10b981;border-color:rgba(16,185,129,0.35);">🎲</span>
              <div class="item-content">
                <span class="item-title">Counting Lab</span>
                <span class="item-desc">Chương 3: Ánh xạ, Dirichlet, Tổ hợp, Truy hồi</span>
              </div>
            </button>
            <button type="button" class="dropdown-item" data-view="relation" role="menuitem">
              <span class="item-icon" style="color:#8b5cf6;border-color:rgba(139,92,246,0.35);">🔗</span>
              <div class="item-content">
                <span class="item-title">Relation Lab</span>
                <span class="item-desc">Chương 4: Ma trận quan hệ, Warshall, Hasse POSET</span>
              </div>
            </button>
            <button type="button" class="dropdown-item" data-view="lab" role="menuitem">
              <span class="item-icon" style="color:#3b82f6;border-color:rgba(59,130,246,0.35);">🌐</span>
              <div class="item-content">
                <span class="item-title">Graph Lab</span>
                <span class="item-desc">Chương 5: Đồ thị, Dijkstra, Prim, Kruskal, Euler...</span>
              </div>
            </button>
          </div>
        </div>

        <button class="nav-btn" data-view="ai">
          <span>🤖</span>
          <span class="nav-text">AI Assistant</span>
        </button>
        <button class="nav-btn" data-view="quiz">
          <span>🎯</span>
          <span class="nav-text">Luyện tập &amp; Đề thi</span>
        </button>
        <button class="nav-btn" data-view="admin" id="navBtnAdmin" style="display: none;">
          <span>🗄️</span>
          <span class="nav-text">Quản trị Database</span>
        </button>
      </nav>
    </div>

    <!-- Header Actions: Unified User & Quick Settings Dropdown -->
    <div class="header-actions">
      <div class="user-dropdown-wrap" id="userDropdownWrap">
        <button class="btn-auth-user" id="btnUserAuth" aria-haspopup="true" aria-expanded="false" title="Menu tài khoản &amp; cài đặt nhanh">
          <span class="auth-btn-icon" id="iconUserAuth">👤</span>
          <span class="auth-btn-label" id="lblUserAuthName">Đăng nhập</span>
          <span class="auth-btn-caret" id="caretUserAuth">▾</span>
        </button>

        <!-- Dropdown Menu -->
        <div class="user-dropdown-menu" id="userDropdownMenu" role="menu">
          <!-- Mini Profile Header -->
          <div class="user-dropdown-header" id="userDropdownHeader">
            <span class="user-dropdown-avatar" id="userDropdownAvatar">👤</span>
            <div class="user-dropdown-info">
              <strong class="user-dropdown-name" id="userDropdownFullName">Khách</strong>
              <span class="user-dropdown-role" id="userDropdownRole">Chưa đăng nhập</span>
            </div>
          </div>

          <div class="user-dropdown-divider"></div>

          <!-- 1. Account / Profile Item -->
          <button type="button" class="user-dropdown-item" id="btnUserDropdownProfile" role="menuitem">
            <span class="dropdown-item-icon">👤</span>
            <div class="dropdown-item-text">
              <span class="dropdown-item-title" id="lblUserDropdownProfile">Hồ sơ &amp; Đăng nhập</span>
              <span class="dropdown-item-sub">Quản lý tài khoản, lịch sử AI</span>
            </div>
          </button>

          <!-- 2. Teaching Pen & Laser (Admin only) -->
          <button type="button" class="user-dropdown-item" id="btnTeacherToolsToggle" style="display: none;" role="menuitem">
            <span class="dropdown-item-icon">✏️</span>
            <div class="dropdown-item-text">
              <span class="dropdown-item-title">Bút giảng dạy &amp; Laser</span>
              <span class="dropdown-item-sub">Vẽ, laser pointer, ghi chú bài giảng</span>
            </div>
            <span class="dropdown-item-badge" id="lblTeacherToolStatus">Tắt</span>
          </button>

          <!-- 3. Help Guide -->
          <button type="button" class="user-dropdown-item" id="btnHelpGuideToggle" role="menuitem">
            <span class="dropdown-item-icon">❓</span>
            <div class="dropdown-item-text">
              <span class="dropdown-item-title">Hướng dẫn sử dụng</span>
              <span class="dropdown-item-sub">Phím tắt &amp; hướng dẫn các phòng Lab</span>
            </div>
          </button>

          <!-- 4. Theme Toggle -->
          <button type="button" class="user-dropdown-item" id="btnThemeToggle" role="menuitem">
            <span class="dropdown-item-icon" id="iconThemeToggleMenu">☀️</span>
            <div class="dropdown-item-text">
              <span class="dropdown-item-title" id="lblThemeToggleMenuTitle">Chế độ Sáng</span>
              <span class="dropdown-item-sub" id="lblThemeToggleMenuSub">Đang bật chế độ Tối</span>
            </div>
          </button>

          <!-- 5. Logout Item (only when logged in) -->
          <div class="user-dropdown-divider" id="userDropdownLogoutDivider" style="display: none;"></div>
          <button type="button" class="user-dropdown-item user-dropdown-item-danger" id="btnUserDropdownLogout" style="display: none;" role="menuitem">
            <span class="dropdown-item-icon">🚪</span>
            <div class="dropdown-item-text">
              <span class="dropdown-item-title">Đăng xuất</span>
              <span class="dropdown-item-sub">Trở về chế độ khách</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Drawer (Mobile only) -->
  <div class="mobile-nav-drawer" id="mobileNavDrawer" aria-hidden="true">
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <div class="mobile-nav-panel">
      <!-- Drawer Header -->
      <div class="mobile-nav-header">
        <div class="mobile-nav-brand">
          <span class="brand-icon">⚡</span>
          <span class="mobile-brand-title">Toán Rời Rạc</span>
        </div>
        <button type="button" class="btn-mobile-nav-close" id="btnMobileNavClose" aria-label="Đóng menu">✕</button>
      </div>

      <!-- User Mini Card in Drawer -->
      <div class="mobile-nav-user-card" id="mobileNavUserCard">
        <span class="mobile-user-avatar" id="mobileNavAvatar">👤</span>
        <div class="mobile-user-details">
          <strong class="mobile-user-name" id="mobileNavUserName">Khách</strong>
          <span class="mobile-user-role" id="mobileNavUserRole">Chưa đăng nhập</span>
        </div>
        <button type="button" class="btn-sm" id="btnMobileNavAuthAction" style="margin-left:auto;font-size:12px;padding:5px 12px;border-radius:6px;font-weight:700;">Đăng nhập</button>
      </div>

      <!-- Drawer Scrollable Body -->
      <div class="mobile-nav-body">
        <div class="mobile-nav-section-title">CHUYÊN MỤC CHÍNH</div>
        <button type="button" class="mobile-nav-item active" data-view="home">
          <span class="mobile-nav-icon">🏠</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Trang chủ</span>
            <span class="mobile-nav-sub">Tổng quan hệ thống</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" data-view="theory">
          <span class="mobile-nav-icon">📚</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Lý thuyết</span>
            <span class="mobile-nav-sub">20 chuyên đề giáo trình</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" data-view="quiz">
          <span class="mobile-nav-icon">🎯</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Luyện tập &amp; Đề thi</span>
            <span class="mobile-nav-sub">Khảo thí định kỳ thang 10</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" data-view="ai">
          <span class="mobile-nav-icon">🤖</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Trợ lý AI</span>
            <span class="mobile-nav-sub">Nhận diện ảnh &amp; giải đáp</span>
          </div>
        </button>

        <div class="mobile-nav-section-title" style="margin-top:16px;">PHÒNG THỰC NGHIỆM (LABS)</div>
        <button type="button" class="mobile-nav-item" data-view="logic">
          <span class="mobile-nav-icon" style="color:#f59e0b;">⚡</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Logic Lab</span>
            <span class="mobile-nav-sub">Bảng chân trị, K-Map, Mạch số</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" data-view="counting">
          <span class="mobile-nav-icon" style="color:#10b981;">🎲</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Counting Lab</span>
            <span class="mobile-nav-sub">Ánh xạ, Dirichlet, Tổ hợp, Truy hồi</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" data-view="relation">
          <span class="mobile-nav-icon" style="color:#8b5cf6;">🔗</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Relation Lab</span>
            <span class="mobile-nav-sub">Ma trận quan hệ, Warshall, POSET</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" data-view="lab">
          <span class="mobile-nav-icon" style="color:#3b82f6;">🌐</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Graph Lab</span>
            <span class="mobile-nav-sub">7 Thuật toán đồ thị kinh điển</span>
          </div>
        </button>

        <!-- Admin View (Only if Admin) -->
        <button type="button" class="mobile-nav-item" data-view="admin" id="mobileNavBtnAdmin" style="display:none;">
          <span class="mobile-nav-icon">🗄️</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Quản trị Database</span>
            <span class="mobile-nav-sub">Quản lý CSDL &amp; sinh viên</span>
          </div>
        </button>

        <div class="mobile-nav-section-title" style="margin-top:16px;">CÀI ĐẶT &amp; TIỆN ÍCH</div>
        <button type="button" class="mobile-nav-item" id="btnMobileNavTheme">
          <span class="mobile-nav-icon" id="mobileNavThemeIcon">☀️</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title" id="mobileNavThemeTitle">Chế độ Sáng / Tối</span>
            <span class="mobile-nav-sub" id="mobileNavThemeSub">Đổi tông màu giao diện</span>
          </div>
        </button>
        <button type="button" class="mobile-nav-item" id="btnMobileNavHelp">
          <span class="mobile-nav-icon">❓</span>
          <div class="mobile-nav-label">
            <span class="mobile-nav-title">Hướng dẫn sử dụng</span>
            <span class="mobile-nav-sub">Phím tắt &amp; tài liệu hướng dẫn</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Views Container -->
  <main id="app" class="app-main">
    <!-- 1. Home View -->
    <div class="app-view active" id="homeView"></div>

    <!-- 2. Theory View -->
    <div class="app-view" id="theoryView"></div>

    <!-- 3. Algorithm Lab View -->
    <div class="app-view" id="labView"></div>

    <!-- 4. Logic Lab View -->
    <div class="app-view" id="logicView"></div>

    <!-- 5. AI Assistant View -->
    <div class="app-view" id="aiView"></div>

    <!-- 6. Fundamentals Theory View -->
    <div class="app-view" id="fundamentalsView"></div>

    <!-- 7. Quiz & Exam Studio View -->
    <div class="app-view" id="quizView"></div>

    <!-- 8. Counting Lab View -->
    <div class="app-view" id="countingView"></div>

    <!-- 9. Relation Lab View -->
    <div class="app-view" id="relationView"></div>

    <!-- 10. Admin Database & Student Management View -->
    <div class="app-view" id="adminView"></div>
  </main>

  <!-- Application Bootstrap Module -->
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
